# ============ CONFIG PREVIEW: tema hugo-mana-theme ============
# Use com: hugo server --config hugo-mana.yml
# Este arquivo NÃO afeta o site publicado (hugo.yml/PaperMod) até você aprovar.
baseURL: "https://adilsonmenechini.github.io/blog/"
defaultContentLanguage: "pt"
locale: "pt-br"
title: "Adilson's Guide"
theme: "hugo-mana-theme"
enableRobotsTXT: true

pagination:
  pageSize: 10

taxonomies:
  tag: tags

markup:
  tableOfContents:
    startLevel: 1
    endLevel: 6
    ordered: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    codeFences: true
    guessSyntax: true
    noClasses: false
    style: "catppuccin-macchiato"

# JSON na home alimenta a busca full-text do tema
outputs:
  home: ["HTML", "JSON"]

sitemap:
  changefreq: "weekly"
  priority: 0.5
  filename: "sitemap.xml"

# Conteúdo: PT em content/pt (URL na raiz), EN em content/en (URL /en/)
languages:
  pt:
    locale: "pt-BR"
    label: "Português"
    direction: "ltr"
    contentDir: "content/pt"
    weight: 1
    title: "Adilson's Guide"
    params:
      description: "Um blog pessoal sobre SRE, engenharia de plataforma, Kubernetes, GitOps, IaC, observabilidade e IA aplicada, e de tudo um pouco."
      author: "Adilson Menechini"
      heroTitleLine1: "Adilson's Guide"
      heroTitleLine2: "to everything"
      footerText: "Feito com Hugo e o tema Mana"
      custom404Message: "Desculpe, a página que você procura não foi encontrada."
    menus:
      main:
        - name: "Início"
          pageRef: "/"
          weight: 10
        - name: "Artigos"
          pageRef: "/posts"
          weight: 20
        - name: "Tags"
          pageRef: "/tags"
          weight: 30
        - name: "Sobre"
          pageRef: "/about"
          weight: 40

  en:
    locale: "en-US"
    label: "English"
    direction: "ltr"
    contentDir: "content/en"
    weight: 2
    title: "Adilson's Guide"
    params:
      description: "A personal blog about SRE, platform engineering, Kubernetes, GitOps, IaC, observability and applied AI, plus a bit of everything."
      author: "Adilson Menechini"
      heroTitleLine1: "Adilson's Guide"
      heroTitleLine2: "to everything"
      footerText: "Built with Hugo and the Mana theme"
      custom404Message: "Sorry, the page you are looking for could not be found."
    menus:
      main:
        - name: "Home"
          pageRef: "/"
          weight: 10
        - name: "Posts"
          pageRef: "/posts"
          weight: 20
        - name: "Tags"
          pageRef: "/tags"
          weight: 30
        - name: "About"
          pageRef: "/about"
          weight: 40

  es:
    locale: "es-ES"
    label: "Español"
    direction: "ltr"
    contentDir: "content/es"
    weight: 3
    title: "Adilson's Guide"
    params:
      description: "Un blog personal sobre SRE, platform engineering, Kubernetes, GitOps, IaC, observabilidad e IA aplicada, y de todo un poco."
      author: "Adilson Menechini"
      heroTitleLine1: "Adilson's Guide"
      heroTitleLine2: "to everything"
      footerText: "Hecho con Hugo y el tema Mana"
      custom404Message: "Lo sentimos, la página que buscás no fue encontrada."
    menus:
      main:
        - name: "Inicio"
          pageRef: "/"
          weight: 10
        - name: "Artículos"
          pageRef: "/posts"
          weight: 20
        - name: "Etiquetas"
          pageRef: "/tags"
          weight: 30
        - name: "Sobre mí"
          pageRef: "/about"
          weight: 40

params:
  enableIntegrity: false
  relatedPostsCount: 3
  description: "SRE · Platform Engineering · Kubernetes · GitOps · Observabilidade · IA aplicada"
  author: "Adilson Menechini"
  footerText: "Feito com Hugo e agentes de IA"

  avatar:
    home:
      assetPath: "images/transparent-logo.png"
    about:
      assetPath: "images/transparent-logo.png"

  social:
    github: "https://github.com/adilsonmenechini"
    linkedin: "https://www.linkedin.com/in/adilson-menechini/"
    email: "adilsonmenechini@gmail.com"

  codeHighlight:
    darkTheme: "catppuccin-macchiato"
    lightTheme: "catppuccin-frappe"

  copyright:
    startYear: 2026
    owner: "Adilson Menechini"

  admonitions:
    alertStyle: "favicon"
